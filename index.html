<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quack Attack!</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #87CEEB;
    font-family: Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  canvas {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    max-height: calc(100% - 44px);
  }
  #controls {
    height: 44px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px;
    background: #87CEEB;
    border-top: 2px solid #6bb3e0;
  }
  button {
    font-size: 14px;
    padding: 6px 12px;
    border: 1px solid #2C3E50;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  button:hover { background: #eef; }
  label { font-size: 13px; }
  input[type=range] { width: 140px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="600"></canvas>
  <div id="controls">
    <button id="play">Play music</button>
    <button id="stop">Stop</button>
    <label>Volume <input type="range" id="vol" min="0" max="100" value="70"></label>
    <label id="tap" style="margin-left:auto; font-size:12px; color:#333;">Tap the canvas for a new dance!</label>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

function resize() {
  const availW = window.innerWidth;
  const availH = window.innerHeight - 44;
  const scale = Math.min(availW / W, availH / H, 1);
  canvas.style.width = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

const splashes = [];
function addSplash(x, y) {
  for (let i = 0; i < 5; i++) {
    splashes.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 6,
      vy: -Math.random() * 5 - 2,
      life: 20 + Math.random() * 15,
      size: 3 + Math.random() * 4
    });
  }
}

// ---------- Ducks ----------
class Duck {
  constructor() {
    this.x = 150 + Math.random() * (W - 300);
    this.y = 340 + Math.random() * 100;
    this.colors = ["#FFD700","#FFA500","#FFB347","#FFCC00","#FFE066"];
    this.color = this.colors[Math.floor(Math.random()*this.colors.length)];
    this.beaks = ["#FF8C00","#FF6600","#FF4500"];
    this.beak = this.beaks[Math.floor(Math.random()*this.beaks.length)];
    this.size = 22 + Math.random() * 10;
    this.phase = Math.random() * Math.PI * 2;
    this.speed = 0.03 + Math.random() * 0.04;
    this.vx = (Math.random() * 0.6) - 0.3;
    this.style = ["bounce","spin","wiggle","wave"][Math.floor(Math.random()*4)];
    this.angle = 0;
    this.foot = Math.random() * Math.PI * 2;
    this.stains = [];
    for (let i = 0; i < 6 + Math.floor(Math.random() * 6); i++) {
      this.stains.push(this.makeStain());
    }
    this.hitTimer = 0;
    this.weapon = "knife";
    this.shootTimer = 0;
    this.recoil = 0;
    this.pellets = [];
    this.rockets = [];
    this.explosions = [];
    this.shells = [];
  }

  makeStain() {
    return {
      x: (Math.random() - 0.5) * 2,
      y: (Math.random() - 0.5) * 1.6,
      size: 5 + Math.random() * 8,
      opacity: 0.7 + Math.random() * 0.3
    };
  }

  update(tick) {
    const t = tick * this.speed + this.phase;
    this.foot += 0.15;
    this.x += this.vx;
    if (this.x < 80) { this.vx = Math.abs(this.vx); this.x = 80; }
    if (this.x > W - 80) { this.vx = -Math.abs(this.vx); this.x = W - 80; }
    if (this.style === "bounce") { this.oy = Math.abs(Math.sin(t*2))*25; this.angle = Math.sin(t*3)*15; }
    else if (this.style === "spin") { this.oy = Math.abs(Math.sin(t))*10; this.angle = (tick*2)%360; }
    else if (this.style === "wiggle") { this.oy = Math.sin(t*1.5)*8; this.angle = Math.sin(t*4)*25; }
    else { this.oy = Math.abs(Math.sin(t))*15; this.angle = Math.sin(t*2.5)*20; }

    if (Math.random() < 0.03) {
      this.stains.push(this.makeStain());
      if (this.stains.length > 20) this.stains.shift();
      if (Math.random() < 0.15) addSplash(this.x, this.y);
    }

    if (this.hitTimer > 0) this.hitTimer--;

    if (this.weapon === "shotgun") {
      if (this.shootTimer > 0) this.shootTimer--;
      if (this.recoil > 0) {
        this.recoil *= 0.8;
        if (this.recoil < 0.1) this.recoil = 0;
      }
      const tg = this.nearestTarget();
      if (tg && Math.random() < 0.06) {
        this.shootTimer = 8;
        this.recoil = 3;
        const aim = Math.atan2((tg.y - tg.oy) - (this.y - this.oy), tg.x - this.x);
        for (let i = 0; i < 6; i++) {
          const ang = aim + (Math.random() - 0.5) * 0.4;
          this.pellets.push({
            x: this.x + Math.cos(ang) * this.size * 1.2,
            y: (this.y - this.oy) + Math.sin(ang) * this.size * 1.2,
            vx: Math.cos(ang) * 5,
            vy: Math.sin(ang) * 5,
            life: 15
          });
        }
      }
      for (let i = this.pellets.length - 1; i >= 0; i--) {
        const p = this.pellets[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        for (const other of ducks) {
          if (other === this) continue;
          const d = Math.sqrt((p.x - other.x) ** 2 + (p.y - (other.y - other.oy)) ** 2);
          if (d < other.size * 1.1) {
            other.hitTimer = 20;
            other.vx = Math.sign(p.vx) * 2;
            other.stains.push(other.makeStain());
            p.life = 0;
            break;
          }
        }
        if (p.life <= 0) this.pellets.splice(i, 1);
      }
    }

    if (this.weapon === "rocket_launcher") {
      if (this.shootTimer > 0) this.shootTimer--;
      if (this.recoil > 0) {
        this.recoil *= 0.85;
        if (this.recoil < 0.1) this.recoil = 0;
      }
      const tg = this.nearestTarget();
      if (tg && Math.random() < 0.03) {
        this.shootTimer = 20;
        this.recoil = 8;
        const aim = Math.atan2((tg.y - tg.oy) - (this.y - this.oy), tg.x - this.x);
        this.rockets.push({
          x: this.x + Math.cos(aim) * this.size * 1.5,
          y: (this.y - this.oy) + Math.sin(aim) * this.size * 1.5,
          vx: Math.cos(aim) * 4,
          vy: Math.sin(aim) * 4,
          life: 100,
          trail: [],
          trailTick: 0
        });
      }
      for (let i = this.rockets.length - 1; i >= 0; i--) {
        const r = this.rockets[i];
        r.trailTick++;
        if (r.trailTick % 3 === 0 && r.trail.length < 8) {
          r.trail.push({ x: r.x, y: r.y, life: 12 });
        }
        const prevX = r.x, prevY = r.y;
        r.x += r.vx;
        r.y += r.vy;
        r.life--;
        for (let j = r.trail.length - 1; j >= 0; j--) {
          r.trail[j].life--;
          if (r.trail[j].life <= 0) r.trail.splice(j, 1);
        }
        let hit = false;
        for (const other of ducks) {
          if (other === this || other.weapon === "tank") continue;
          const ox = other.x, oy = other.y - other.oy;
          for (let st = 0; st < 4; st++) {
            const sx = prevX + (r.x - prevX) * st / 4;
            const sy = prevY + (r.y - prevY) * st / 4;
            if (Math.sqrt((sx - ox) ** 2 + (sy - oy) ** 2) < other.size * 1.4) {
              this.explode(r.x, r.y);
              other.hitTimer = 30;
              other.vx = Math.sign(r.vx) * 3;
              for (let k = 0; k < 8; k++) other.stains.push(other.makeStain());
              hit = true;
              break;
            }
          }
          if (hit) break;
        }
        if (!hit) {
          const offscreen = r.x < -50 || r.x > W + 50 || r.y < -50 || r.y > H + 50;
          if (r.life <= 0 || offscreen) {
            if (!offscreen) this.explode(r.x, r.y);
            hit = true;
          }
        }
        if (hit) this.rockets.splice(i, 1);
      }
      for (let i = this.explosions.length - 1; i >= 0; i--) {
        const e = this.explosions[i];
        e.life--;
        if (e.life <= 0) this.explosions.splice(i, 1);
      }
    }

    if (this.weapon === "tank") {
      if (this.shootTimer > 0) this.shootTimer--;
      const tg2 = this.nearestTarget();
      if (tg2 && Math.random() < 0.05) {
        this.shootTimer = 12;
        const aim = Math.atan2((tg2.y - tg2.oy) - (this.y - this.oy), tg2.x - this.x);
        this.shells.push({
          x: this.x + Math.cos(aim) * this.size * 2,
          y: (this.y - this.oy) + Math.sin(aim) * this.size * 2,
          vx: Math.cos(aim) * 6,
          vy: Math.sin(aim) * 6,
          life: 40
        });
      }
      for (let i = this.shells.length - 1; i >= 0; i--) {
        const s = this.shells[i];
        s.x += s.vx;
        s.y += s.vy;
        s.life--;
        for (const other of ducks) {
          if (other === this || other.weapon === "tank") continue;
          const d = Math.sqrt((s.x - other.x) ** 2 + (s.y - (other.y - other.oy)) ** 2);
          if (d < other.size * 1.6) {
            this.explode(s.x, s.y);
            other.hitTimer = 35;
            other.vx = Math.sign(s.vx) * 4;
            for (let k = 0; k < 10; k++) other.stains.push(other.makeStain());
            s.life = 0;
            break;
          }
        }
        if (s.life <= 0) this.shells.splice(i, 1);
      }
      for (let i = this.explosions.length - 1; i >= 0; i--) {
        const e = this.explosions[i];
        e.life--;
        if (e.life <= 0) this.explosions.splice(i, 1);
      }
    }
  }

  nearestTarget() {
    let best = null, bestD = Infinity;
    for (const other of ducks) {
      if (other === this) continue;
      const d = Math.hypot((other.x - this.x), (other.y - other.oy) - (this.y - this.oy));
      if (d < bestD) { bestD = d; best = other; }
    }
    return bestD < 500 ? best : null;
  }

  explode(x, y) {
    this.explosions.push({ x, y, life: 18, size: 12 });
    for (let k = 0; k < 10; k++) this.explosions.push({
      x: x + (Math.random() - 0.5) * 24,
      y: y + (Math.random() - 0.5) * 24,
      life: 12, size: 3 + Math.random() * 4
    });
  }

  getPos() {
    return { x: this.x, y: this.y - this.oy };
  }

  checkCollision(other) {
    const p1 = this.getPos();
    const p2 = other.getPos();
    const dx = p2.x - p1.x;
    const dy = p2.y - p1.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const minDist = (this.size + other.size) * 0.8;
    if (dist < minDist && dist > 0) {
      const nx = dx / dist;
      const ny = dy / dist;
      this.vx = -nx * 1.5;
      other.vx = nx * 1.5;
      const overlap = minDist - dist;
      this.x -= nx * overlap * 0.5;
      other.x += nx * overlap * 0.5;
      this.hitTimer = 15;
      other.hitTimer = 15;
      return true;
    }
    return false;
  }

  draw(tick) {
    const s = this.size, dx = this.x - ((this.weapon === "shotgun" || this.weapon === "rocket_launcher") ? this.recoil : 0), dy = this.y - this.oy;
    ctx.fillStyle = "#555";
    ctx.beginPath();
    ctx.ellipse(dx, this.y + s*0.9, s*0.8, 4, 0, 0, Math.PI*2);
    ctx.fill();

    const a = this.angle * Math.PI/180;
    const facing = Math.cos(a);

    // Webbed feet
    const fo = Math.sin(this.foot)*4;
    ctx.strokeStyle = this.beak;
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    for (const side of [-1,1]) {
      const fx = dx + side*s*0.25, fy = dy + s*0.55;
      const ax = fx + side*2, ay = fy + 6 + fo;
      ctx.beginPath();
      ctx.moveTo(fx, fy); ctx.lineTo(ax, ay);
      ctx.stroke();
      for (const toe of [0,-1,1]) {
        const tx = ax + side*4 + toe*side*6, ty = ay + 8;
        ctx.beginPath();
        ctx.moveTo(ax, ay); ctx.lineTo(tx, ty);
        ctx.stroke();
      }
    }

    // Tail
    ctx.fillStyle = this.color;
    ctx.strokeStyle = "#CC8800";
    ctx.lineWidth = 1;
    const ty_ = dy + s*0.15;
    ctx.beginPath();
    ctx.moveTo(dx - facing*s*0.95, ty_ - s*0.1);
    ctx.lineTo(dx - facing*s*0.75, ty_);
    ctx.lineTo(dx - facing*s*0.95, ty_ + s*0.3);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // Body (teardrop)
    ctx.fillStyle = this.color;
    ctx.strokeStyle = "#C07820";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(dx, dy, s, s*0.75, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    // Belly highlight
    ctx.fillStyle = "#F7E7A8";
    ctx.beginPath();
    ctx.ellipse(dx, dy + s*0.4, s*0.55, s*0.35, 0, 0, Math.PI*2);
    ctx.fill();

    // Juice stains on body
    for (const stain of this.stains) {
      const sx = dx + stain.x * s * 0.85;
      const sy = dy + stain.y * s * 0.55;
      ctx.fillStyle = `rgba(180, 20, 20, ${stain.opacity})`;
      ctx.beginPath();
      ctx.ellipse(sx, sy, stain.size, stain.size * 0.7, stain.x * 2, 0, Math.PI*2);
      ctx.fill();
    }

    // Neck + head (curved)
    const hOff = s*0.8;
    const hx = dx + facing*hOff;
    const hy = dy - s*0.5 + Math.sin(a)*3;
    const headR = s*0.4;
    ctx.strokeStyle = this.color;
    ctx.lineWidth = s*0.3;
    ctx.beginPath();
    ctx.moveTo(dx + facing*s*0.1, dy - s*0.2);
    ctx.quadraticCurveTo(hx, hy + s*0.1, hx - facing*s*0.25, hy + s*0.25);
    ctx.stroke();
    ctx.fillStyle = this.color;
    ctx.strokeStyle = "#C07820";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(hx, hy, headR, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();

    for (const stain of this.stains) {
      if (Math.abs(stain.y + 0.7) < 0.5 && Math.abs(stain.x - facing*0.7) < 0.6) {
        const sx = hx + stain.x * s * 0.3;
        const sy = hy + (stain.y + 0.7) * s * 0.3;
        ctx.fillStyle = `rgba(180, 20, 20, ${stain.opacity})`;
        ctx.beginPath();
        ctx.ellipse(sx, sy, stain.size * 0.6, stain.size * 0.4, stain.x, 0, Math.PI*2);
        ctx.fill();
      }
    }

    // Eye
    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(hx + facing*headR*0.45, hy - headR*0.1, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(hx + facing*headR*0.45 - 1, hy - headR*0.1 - 1, 1, 0, Math.PI*2);
    ctx.fill();

    // Broad duck bill with nostril
    const billLen = s*0.28;
    ctx.fillStyle = this.beak;
    ctx.strokeStyle = "#CC5500";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(hx + facing*headR*0.8, hy + headR*0.3 - s*0.12);
    ctx.lineTo(hx + facing*headR*0.8 + facing*billLen, hy + headR*0.3);
    ctx.lineTo(hx + facing*headR*0.8 + facing*billLen, hy + headR*0.3 + s*0.06);
    ctx.lineTo(hx + facing*headR*0.8, hy + headR*0.3 + s*0.12);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#996600";
    ctx.beginPath();
    ctx.arc(hx + facing*headR*0.8 + facing*billLen*0.3, hy + headR*0.3, 1, 0, Math.PI*2);
    ctx.fill();

    // Shaped wing
    const ww = Math.sin(this.foot)*8;
    const wingX = dx - facing*s*0.25, wingY = dy - s*0.1 + ww;
    ctx.fillStyle = "#C8A24B";
    ctx.strokeStyle = "#A07a20";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(wingX - s*0.3, wingY - s*0.2);
    ctx.lineTo(wingX + s*0.3, wingY - s*0.1);
    ctx.lineTo(wingX + s*0.5, wingY + s*0.15);
    ctx.lineTo(wingX - s*0.2, wingY + s*0.3);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    if (this.weapon === "shotgun") {
      const knifeAngle = (this.angle + 30) * Math.PI / 180;
      const kx = dx + s * 0.3;
      const ky = dy + ww - s * 0.1;
      const klen = s * 1.4;
      const handleLen = klen * 0.3;
      const barrelLen = klen * 0.7;
      const hx1 = kx + Math.cos(knifeAngle) * handleLen;
      const hy1 = ky + Math.sin(knifeAngle) * handleLen;
      const bx1 = hx1 + Math.cos(knifeAngle) * barrelLen;
      const by1 = hy1 + Math.sin(knifeAngle) * barrelLen;
      const perpX = Math.cos(knifeAngle + Math.PI / 2) * 3;
      const perpY = Math.sin(knifeAngle + Math.PI / 2) * 3;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#6B3410";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(kx, ky);
      ctx.lineTo(hx1, hy1);
      ctx.stroke();
      ctx.strokeStyle = "#333333";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(hx1, hy1);
      ctx.lineTo(bx1, by1);
      ctx.stroke();
      ctx.strokeStyle = "#555555";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(hx1, hy1);
      ctx.lineTo(bx1, by1);
      ctx.stroke();
      ctx.strokeStyle = "#222222";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(bx1 - perpX, by1 - perpY);
      ctx.lineTo(bx1 + perpX, by1 + perpY);
      ctx.stroke();
      const pumpX = hx1 + Math.cos(knifeAngle) * barrelLen * 0.4;
      const pumpY = hy1 + Math.sin(knifeAngle) * barrelLen * 0.4;
      ctx.strokeStyle = "#8B4513";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(pumpX - perpX * 1.5, pumpY - perpY * 1.5);
      ctx.lineTo(pumpX + perpX * 1.5, pumpY + perpY * 1.5);
      ctx.stroke();

      if (this.shootTimer > 0) {
        const flashSize = s * 0.6;
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.arc(bx1, by1, flashSize, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#FFA500";
        ctx.beginPath();
        ctx.arc(bx1, by1, flashSize * 0.6, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath();
        ctx.arc(bx1, by1, flashSize * 0.3, 0, Math.PI*2);
        ctx.fill();
      }

      for (const p of this.pellets) {
        ctx.fillStyle = "#FF4500";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 2, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 1, 0, Math.PI*2);
        ctx.fill();
      }
    } else if (this.weapon === "rocket_launcher") {
      const rlAngle = (this.angle + 20) * Math.PI / 180;
      const kx = dx + s * 0.2;
      const ky = dy + ww - s * 0.15;
      const rlLen = s * 1.8;
      const tx1 = kx + Math.cos(rlAngle) * rlLen;
      const ty1 = ky + Math.sin(rlAngle) * rlLen;
      const perpX = Math.cos(rlAngle + Math.PI / 2) * 4;
      const perpY = Math.sin(rlAngle + Math.PI / 2) * 4;
      ctx.lineCap = "round";
      ctx.strokeStyle = "#6B3410";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.moveTo(kx, ky);
      ctx.lineTo(kx + Math.cos(rlAngle) * rlLen * 0.25, ky + Math.sin(rlAngle) * rlLen * 0.25);
      ctx.stroke();
      ctx.strokeStyle = "#2F4F2F";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(kx + Math.cos(rlAngle) * rlLen * 0.2, ky + Math.sin(rlAngle) * rlLen * 0.2);
      ctx.lineTo(tx1, ty1);
      ctx.stroke();
      ctx.strokeStyle = "#3A5F3A";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(kx + Math.cos(rlAngle) * rlLen * 0.2, ky + Math.sin(rlAngle) * rlLen * 0.2);
      ctx.lineTo(tx1, ty1);
      ctx.stroke();
      ctx.strokeStyle = "#1A1A1A";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(tx1 - perpX * 1.5, ty1 - perpY * 1.5);
      ctx.lineTo(tx1 + perpX * 1.5, ty1 + perpY * 1.5);
      ctx.stroke();
      const gripX = kx + Math.cos(rlAngle) * rlLen * 0.4;
      const gripY = ky + Math.sin(rlAngle) * rlLen * 0.4;
      ctx.strokeStyle = "#5C3317";
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(gripX, gripY);
      ctx.lineTo(gripX - perpX * 2, gripY - perpY * 2);
      ctx.stroke();
      const sightX = kx + Math.cos(rlAngle) * rlLen * 0.5;
      const sightY = ky + Math.sin(rlAngle) * rlLen * 0.5;
      ctx.strokeStyle = "#333333";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sightX - perpX * 0.5, sightY - perpY * 0.5 - 5);
      ctx.lineTo(sightX + perpX * 0.5, sightY + perpY * 0.5 - 5);
      ctx.stroke();

      if (this.shootTimer > 12) {
        const flashSize = s * 1.0;
        ctx.fillStyle = "#FF4500";
        ctx.beginPath();
        ctx.arc(tx1, ty1, flashSize, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#FFD700";
        ctx.beginPath();
        ctx.arc(tx1, ty1, flashSize * 0.6, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#FFFFFF";
        ctx.beginPath();
        ctx.arc(tx1, ty1, flashSize * 0.3, 0, Math.PI*2);
        ctx.fill();
      }

      for (const r of this.rockets) {
        for (const t of r.trail) {
          const alpha = t.life / 20;
          const tSize = 4 + (1 - alpha) * 6;
          ctx.fillStyle = `rgba(136, 136, 136, ${alpha})`;
          ctx.beginPath();
          ctx.arc(t.x, t.y, tSize, 0, Math.PI*2);
          ctx.fill();
        }
        const rAng = Math.atan2(r.vy, r.vx);
        const rlen = 12;
        const rpX = Math.cos(rAng + Math.PI / 2) * 4;
        const rpY = Math.sin(rAng + Math.PI / 2) * 4;
        const noseX = r.x + Math.cos(rAng) * rlen;
        const noseY = r.y + Math.sin(rAng) * rlen;
        const tailX = r.x - Math.cos(rAng) * rlen * 0.5;
        const tailY = r.y - Math.sin(rAng) * rlen * 0.5;
        ctx.fillStyle = "#CC0000";
        ctx.beginPath();
        ctx.moveTo(noseX, noseY);
        ctx.lineTo(r.x + rpX, r.y + rpY);
        ctx.lineTo(r.x - rpX, r.y - rpY);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = "#555555";
        ctx.beginPath();
        ctx.moveTo(r.x + rpX, r.y + rpY);
        ctx.lineTo(r.x - rpX, r.y - rpY);
        ctx.lineTo(tailX - rpX * 0.7, tailY - rpY * 0.7);
        ctx.lineTo(tailX + rpX * 0.7, tailY + rpY * 0.7);
        ctx.closePath();
        ctx.fill();
        const flameSize = 6 + Math.random() * 4;
        ctx.fillStyle = "#FF6600";
        ctx.beginPath();
        ctx.arc(tailX, tailY, flameSize, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "#FFCC00";
        ctx.beginPath();
        ctx.arc(tailX, tailY, flameSize * 0.5, 0, Math.PI*2);
        ctx.fill();
      }

      for (const e of this.explosions) {
        const alpha = Math.min(1, e.life / 12);
        const grow = (18 - e.life) * 1.2;
        ctx.fillStyle = `rgba(255, 90, 30, ${alpha})`;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size + grow * 0.5, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = `rgba(255, 200, 50, ${alpha * 0.8})`;
        ctx.beginPath();
        ctx.arc(e.x, e.y, (e.size + grow * 0.5) * 0.6, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.beginPath();
        ctx.arc(e.x, e.y, (e.size + grow * 0.5) * 0.3, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = `rgba(255, 140, 30, ${alpha})`;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.size + grow, 0, Math.PI*2);
        ctx.stroke();
      }
    } else if (this.weapon === "tank") {
      const tw = s * 2.6;
      const th = s * 1.2;
      const tx = dx - 1 * s * 0.2;
      const ty = dy + s * 1.15;

      // tracks
      ctx.fillStyle = "#333333";
      ctx.strokeStyle = "#111111";
      ctx.lineWidth = 2;
      ctx.fillRect(tx - tw*0.5, ty - th*0.3, tw, th*0.7);
      ctx.strokeRect(tx - tw*0.5, ty - th*0.3, tw, th*0.7);
      ctx.fillStyle = "#4A4A4A";
      ctx.fillRect(tx - tw*0.35, ty + th*0.1, tw*0.7, th*0.25);
      // body
      ctx.fillStyle = "#4B6E3A";
      ctx.strokeStyle = "#2E4423";
      ctx.beginPath();
      ctx.moveTo(tx - tw*0.5, ty - th*0.3);
      ctx.lineTo(tx + tw*0.5, ty - th*0.3);
      ctx.lineTo(tx + tw*0.42, ty - th*0.55);
      ctx.lineTo(tx - tw*0.42, ty - th*0.55);
      ctx.closePath();
      ctx.fill(); ctx.stroke();
      // turret
      ctx.fillStyle = "#557A42";
      ctx.beginPath();
      ctx.ellipse(tx, ty - th*0.5, s*0.7, s*0.45, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      // barrel aimed at nearest target
      let aim = 0;
      const trg = this.nearestTarget();
      if (trg) aim = Math.atan2((trg.y - trg.oy) - this.y, trg.x - this.x);
      const bLen = s * 2.4;
      const mzx = tx + Math.cos(aim) * bLen;
      const mzy = ty - th*0.3 + Math.sin(aim) * bLen;
      ctx.strokeStyle = "#2E4423";
      ctx.lineWidth = 7;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(tx + Math.cos(aim) * s * 0.5, ty - th*0.3 + Math.sin(aim) * s * 0.5);
      ctx.lineTo(mzx, mzy);
      ctx.stroke();
      // muzzle flash
      if (this.shootTimer > 6) {
        const fs = s * 0.9;
        ctx.fillStyle = "#FF4500";
        ctx.beginPath(); ctx.arc(mzx, mzy, fs, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#FFD700";
        ctx.beginPath(); ctx.arc(mzx, mzy, fs*0.5, 0, Math.PI*2); ctx.fill();
      }
      // shells
      for (const sh of this.shells) {
        ctx.fillStyle = "#222222";
        ctx.beginPath(); ctx.arc(sh.x, sh.y, 3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "#FFCC00";
        ctx.beginPath(); ctx.arc(sh.x, sh.y, 2, 0, Math.PI*2); ctx.fill();
      }
      // explosions
      for (const e of this.explosions) {
        const alpha = Math.min(1, e.life / 12);
        const grow = (18 - e.life) * 1.2;
        ctx.fillStyle = `rgba(255, 90, 30, ${alpha})`;
        ctx.beginPath(); ctx.arc(e.x, e.y, e.size + grow * 0.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = `rgba(255, 200, 50, ${alpha * 0.8})`;
        ctx.beginPath(); ctx.arc(e.x, e.y, (e.size + grow * 0.5) * 0.6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
        ctx.beginPath(); ctx.arc(e.x, e.y, (e.size + grow * 0.5) * 0.3, 0, Math.PI*2); ctx.fill();
      }
    } else {
      const knifeAngle = (this.angle + 45) * Math.PI / 180;
      const kx = dx + s * 0.4;
      const ky = dy + ww;
      const klen = s * 0.7;
      const handleLen = klen * 0.35;
      const bladeLen = klen * 0.65;
      const hx1 = kx + Math.cos(knifeAngle) * handleLen;
      const hy1 = ky + Math.sin(knifeAngle) * handleLen;
      const bx1 = hx1 + Math.cos(knifeAngle) * bladeLen;
      const by1 = hy1 + Math.sin(knifeAngle) * bladeLen;
      const perpX = Math.cos(knifeAngle + Math.PI / 2) * 2;
      const perpY = Math.sin(knifeAngle + Math.PI / 2) * 2;
      ctx.strokeStyle = "#8B4513";
      ctx.lineWidth = 4;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(kx, ky);
      ctx.lineTo(hx1, hy1);
      ctx.stroke();
      ctx.strokeStyle = "#C0C0C0";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(hx1, hy1);
      ctx.lineTo(bx1, by1);
      ctx.stroke();
      ctx.strokeStyle = "#E0E0E0";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bx1 - perpX, by1 - perpY);
      ctx.lineTo(bx1 + perpX, by1 + perpY);
      ctx.stroke();
    }

    ctx.fillStyle = "#FF9999";
    ctx.beginPath();
    ctx.ellipse(hx, hy + s*0.12, s*0.15, s*0.08, 0, 0, Math.PI*2);
    ctx.fill();

    if (this.hitTimer > 0) {
      for (let i = 0; i < 3; i++) {
        const ang = (this.hitTimer * 40 + i * 120) * Math.PI / 180;
        const starX = dx + Math.cos(ang) * s * 1.2;
        const starY = (dy - s * 0.3) + Math.sin(ang) * s * 0.8;
        ctx.fillStyle = "#FFD700";
        ctx.font = "bold 14px Helvetica";
        ctx.fillText("*", starX, starY);
      }
    }
  }
}

// ---------- Background & scene ----------
function drawBackground(tick, duckTick) {
  const t = duckTick * 0.05;
  ctx.fillStyle = "#87CEEB";
  ctx.fillRect(0, 0, W, 200);

  ctx.fillStyle = "#FFE84D";
  ctx.strokeStyle = "#FFD700";
  ctx.lineWidth = 2;
  for (let i=0;i<12;i++) {
    const ang = i*30*Math.PI/180;
    ctx.beginPath();
    ctx.moveTo(85 + Math.cos(ang)*40, 55 + Math.sin(ang)*40);
    ctx.lineTo(85 + Math.cos(ang)*55, 55 + Math.sin(ang)*55);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(85, 55, 35, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  ctx.fillStyle = "white";
  for (const [cx,cy] of [[200,60],[500,40],[680,80]]) {
    for (const [dx,dy] of [[-20,0],[0,-10],[20,0],[-10,5],[10,5]]) {
      ctx.beginPath();
      ctx.arc(cx+dx, cy+dy, 25, 0, Math.PI*2);
      ctx.fill();
    }
  }

  ctx.fillStyle = "#4A8F3F";
  ctx.strokeStyle = "#3D7A34";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(-50, 280, 190, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(500, 300, 250, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#5AA84A";
  ctx.fillRect(0, 200, W, H-200);

  ctx.fillStyle = "#8B0000";
  ctx.strokeStyle = "#5C0000";
  ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(W/2, H-60, 320, 140, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#A52A2A";
  ctx.beginPath(); ctx.ellipse(W/2, H-50, 260, 110, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#CD5C5C";
  ctx.beginPath(); ctx.ellipse(W/2, H-40, 180, 70, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = "#E06060";
  ctx.beginPath(); ctx.ellipse(W/2, H-30, 100, 35, 0, 0, Math.PI*2); ctx.fill();

  for (let i=0;i<8;i++) {
    const rx = W/2 + Math.sin(t+i*0.7)*120;
    const ry = H-60 + Math.cos(t+i*0.5)*30;
    ctx.strokeStyle = `rgba(255, 100, 100, ${0.4 + Math.sin(t+i)*0.2})`;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.ellipse(rx, ry, 25+i*4, 6, 0, 0, Math.PI*2); ctx.stroke();
  }

  for (const s of sparkles) {
    s.life -= 1;
    if (s.life <= 0) { sparkles.splice(sparkles.indexOf(s), 1); continue; }
    ctx.fillStyle = s.color;
    ctx.font = (10 + s.life/2) + "px Helvetica";
    ctx.fillText("*", s.x, s.y);
  }

  for (let i = splashes.length - 1; i >= 0; i--) {
    const sp = splashes[i];
    sp.x += sp.vx;
    sp.y += sp.vy;
    sp.vy += 0.3;
    sp.life -= 1;
    if (sp.life <= 0) { splashes.splice(i, 1); continue; }
    const alpha = sp.life / 35;
    ctx.fillStyle = `rgba(180, 30, 30, ${alpha})`;
    ctx.beginPath();
    ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle = "#2C3E50";
  ctx.font = "bold 28px Helvetica";
  ctx.textAlign = "center";
  ctx.fillText("Quack Attack!", W/2, 160);
  ctx.font = "10px Helvetica";
  ctx.fillStyle = "#555";
  ctx.fillText("Click anywhere for new dance!", W/2, 185);
}

const sparkles = [];
function addSparkle() {
  if (Math.random() < 0.3) {
    sparkles.push({
      x: 50 + Math.random()*(W-100),
      y: 250 + Math.random()*(H-350),
      life: 20,
      color: ["#FFE84D","#FF69B4","#00FFFF","#FF6347"][Math.floor(Math.random()*4)]
    });
  }
}

// ---------- Audio (Web Audio) ----------
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function makeMelody(volume) {
  ensureAudio();
  const sr = audioCtx.sampleRate;
  const dur = 14;
  const len = Math.floor(sr * dur);
  const buf = audioCtx.createBuffer(1, len, sr);
  const out = buf.getChannelData(0);

  const nf = (semi) => 440 * Math.pow(2, (semi - 69) / 12);

  let phase = 12345;
  const rnd = () => { phase = (phase * 1103515245 + 12345) % 2147483648; return phase / 2147483648; };

  const add = (startSec, samples, gain) => {
    const idx = Math.floor(startSec * sr);
    for (let k = 0; k < samples.length; k++) {
      const j = idx + k;
      if (j >= 0 && j < len) out[j] += samples[k] * gain;
    }
  };

  const lp = (samples, cutoff) => {
    const rc = 1/(2*Math.PI*cutoff), dt = 1/sr, a = dt/(rc+dt);
    let prev = 0; const o = new Float32Array(samples.length);
    for (let i=0;i<samples.length;i++){ prev = prev + (samples[i]-prev)*a; o[i]=prev; }
    return o;
  };

  // Distorted palm-muted guitar (double-tracked detune)
  const chug = (midi, durSec, accent, palm) => {
    const freq = nf(midi);
    const n = Math.floor(durSec * sr);
    const s = new Float32Array(n*2);
    for (let tr=0; tr<2; tr++) {
      const det = tr===0 ? 1.0 : 1.003;
      let prev = 0;
      for (let i=0;i<n;i++){
        const tt = i / sr, f = freq*det;
        let sig;
        if (palm) sig = Math.sin(2*Math.PI*f*tt) + 0.45*Math.sin(2*Math.PI*f*2*tt);
        else sig = Math.sin(2*Math.PI*f*tt) + 0.6*Math.sin(2*Math.PI*f*2*tt) + 0.4*Math.sin(2*Math.PI*f*3*tt) + 0.4*Math.sin(2*Math.PI*f*1.5*tt);
        const env = palm ? Math.exp(-tt*26) : Math.exp(-tt*5);
        const a = palm ? accent : accent*0.9;
        let d = Math.tanh(sig*3.5*env*a);
        d = prev + (d-prev)*0.5; prev = d;
        s[tr*n+i] = d;
      }
    }
    const m = new Float32Array(n);
    for (let i=0;i<n;i++) m[i] = (s[i]+s[n+i]);
    return palm ? lp(m, 1100) : m;
  };

  const bass = (midi, durSec, accent) => {
    const freq = nf(midi);
    const n = Math.floor(durSec*sr), s = new Float32Array(n);
    for (let i=0;i<n;i++){ const tt=i/sr, env=Math.exp(-tt*12); s[i]=(Math.sin(2*Math.PI*freq*tt)+0.25*Math.sin(2*Math.PI*freq*2*tt))*env*accent; }
    return s;
  };

  const kick = () => {
    const d = 0.13, n = Math.floor(d*sr), s = new Float32Array(n);
    for (let i=0;i<n;i++){
      const tt=i/sr;
      const click=Math.sin(2*Math.PI*(700*Math.exp(-tt*130)+250)*tt)*Math.exp(-tt*140)*0.5;
      const body=Math.sin(2*Math.PI*(160*Math.exp(-tt*28)+46)*tt)*Math.exp(-tt*26);
      s[i]=click+body*0.9;
    }
    return s;
  };
  const snare = () => {
    const d=0.18, n=Math.floor(d*sr), s=new Float32Array(n);
    for (let i=0;i<n;i++){
      const tt=i/sr, no=rnd()*2-1, env=Math.exp(-tt*32);
      const crack=Math.sin(2*Math.PI*420*tt)*Math.exp(-tt*110)*0.6;
      const low=Math.sin(2*Math.PI*200*tt)*Math.exp(-tt*45)*0.8;
      s[i]=(no*0.8+crack+low)*env;
    }
    return s;
  };
  const cym = (dur) => {
    const n=Math.floor(dur*sr), s=new Float32Array(n);
    for (let i=0;i<n;i++){ const tt=i/sr, env=Math.exp(-tt*7); s[i]=(rnd()*2-1)*env*0.85; }
    return s;
  };
  const ride = (dur) => {
    const n=Math.floor(dur*sr), s=new Float32Array(n); let last=0;
    for (let i=0;i<n;i++){ const tt=i/sr, env=Math.exp(-tt*9), no=rnd()*2-1; s[i]=(no-last)*0.5*env; last=no; }
    return s;
  };

  const growl = (durSec, start, dark, grit) => {
    const n=Math.floor(durSec*sr), s=new Float32Array(n);
    for (let i=0;i<n;i++){
      const tt=i/sr, no=rnd()*2-1;
      const core_f=60+20*Math.sin(2*Math.PI*4*tt);
      const core=Math.sin(2*Math.PI*core_f*tt);
      const f1=Math.sin(2*Math.PI*480*tt)*0.5*dark;
      const f2=Math.sin(2*Math.PI*780*tt)*0.3*(1-dark*0.5);
      const sub=Math.sin(2*Math.PI*52*tt)*0.6;
      const grits=Math.tanh(no*6)*grit;
      const ei=Math.min(1,tt/0.06); let eo=1; const rem=durSec-tt; if(rem<0.12) eo=rem/0.12;
      const env=ei*eo;
      s[i]=Math.tanh((core+f1+f2+sub+grits*0.5+no*0.25)*env*2.2);
    }
    add(start, s);
  };

  // ================= ARRANGEMENT =================
  const BPM = 110, Q = 60/BPM, S = Q/4;

  // Intro: deep guttural scream over building low hits + feedback swell
  growl(2.6, 0.15, 1.0, 0.7);
  for (let i=0;i<3;i++) add(1.2+i*0.7, kick(), 0.9);
  const feedN = Math.floor(2.2*sr), feed = new Float32Array(feedN);
  for (let i=0;i<feedN;i++){ const tt=i/sr, sw=tt/2.2, f=55+sw*30; feed[i]=Math.tanh(Math.sin(2*Math.PI*f*tt)*sw*3); }
  add(0.8, feed, 0.7);
  add(2.9, cym(0.7), 0.7); add(2.9, kick(), 1.0);

  // Blast-beat intro riff (3.0-4.8s)
  const roots = [31,31,31,31, 34,34,31,31, 29,29,31,31, 34,34,34,36];
  let t0 = 3.0;
  for (let bar=0; bar<2; bar++){
    for (let n16=0; n16<16; n16++){
      const t = t0 + (bar*16+n16)*S, midi = roots[n16];
      const acc = n16%4===0 ? 1.2 : 0.8;
      add(t, chug(midi, S*0.9, acc, true), 0.75);
      add(t, bass(midi, S*0.9, acc*0.8), 0.7);
      add(t, kick(), 0.95);
      if (n16%4===2) add(t, snare(), 0.9);
      if (n16%2===0) add(t, ride(S*0.9), 0.4);
    }
  }
  t0 = 3.0 + 32*S;

  // Main heavy riff: double-bass 16ths + chug (to ~8s)
  const riff = [31,31,31,34, 29,29,31,31, 34,34,31,29, 31,31,38,38];
  while (t0 < 8.0) {
    for (let n16=0; n16<16; n16++){
      const t = t0 + n16*S, midi = riff[n16];
      const acc = n16%4===0 ? 1.3 : 0.75;
      add(t, chug(midi, S*0.92, acc, true), 0.8);
      add(t, bass(midi, S*0.92, acc*0.8), 0.75);
      add(t, kick(), 0.95);
      if (n16%8===2 || n16%8===6) add(t, snare(), 0.92);
      if (n16%4===0) add(t, cym(0.4), 0.6);
    }
    t0 += 16*S;
  }

  // BREAKDOWN: slow huge open chugs + guttural growl (8.0-11.5s)
  add(8.0, cym(0.8), 0.8);
  let bd = 8.2;
  const bdRoots = [31,26,29,22, 31,26,29,22];
  let k = 0;
  while (bd < 11.5) {
    const midi = bdRoots[k % bdRoots.length];
    add(bd, chug(midi, Q*0.9, 1.4, false), 0.95);
    add(bd, bass(midi, Q*0.9, 1.3), 0.85);
    add(bd, kick(), 1.0); add(bd, snare(), 0.95);
    add(bd+Q/2, kick(), 0.85); add(bd+Q/2, kick(), 0.85);
    if (k === 1) growl(2.4, bd, 1.0, 0.8);
    k++; bd += Q;
  }

  // Final machine-gun double kick + closing scream (11.5-14s)
  let mg = 11.6;
  while (mg < 13.6) {
    add(mg, chug(31, S*0.9, 0.9, true), 0.7);
    add(mg, kick(), 0.9);
    add(mg+S/2, kick(), 0.7);
    mg += S;
  }
  growl(1.6, 12.4, 0.6, 0.9);

  // Master: gentle glue saturation + normalize
  for (let i=0;i<len;i++) out[i] = Math.tanh(out[i]*1.4)*0.95;
  let peak = 1e-9;
  for (let i=0;i<len;i++) peak = Math.max(peak, Math.abs(out[i]));
  const scale = (0.95/peak) * (volume/100);
  for (let i=0;i<len;i++) out[i] *= scale;
  return buf;
}

let source = null;
function playMusic() {
  ensureAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  stopMusic();
  const buf = makeMelody(currentVolume);
  source = audioCtx.createBufferSource();
  source.buffer = buf;
  source.loop = true;
  source.connect(audioCtx.destination);
  source.start();
}
function stopMusic() {
  if (source) { try { source.stop(); } catch(e){} source = null; }
}

let currentVolume = 70;
document.getElementById('play').addEventListener('click', () => { ensureAudio(); playMusic(); });
document.getElementById('stop').addEventListener('click', stopMusic);
document.getElementById('vol').addEventListener('input', (e) => {
  currentVolume = parseInt(e.target.value, 10);
  if (source) playMusic();
});

const ducks = [];
for (let i=0;i<6;i++) ducks.push(new Duck());
ducks[Math.floor(Math.random()*6)].weapon = "shotgun";
let rld = Math.floor(Math.random()*6);
while (ducks[rld].weapon !== "knife") rld = Math.floor(Math.random()*6);
 ducks[rld].weapon = "rocket_launcher";
 let tkd = Math.floor(Math.random()*6);
 while (ducks[tkd].weapon !== "knife") tkd = Math.floor(Math.random()*6);
 ducks[tkd].weapon = "tank";
 ducks[tkd].size *= 1.2;

 canvas.addEventListener('click', () => {
  for (const d of ducks) {
    d.phase = Math.random() * Math.PI * 2;
    d.style = ["bounce","spin","wiggle","wave"][Math.floor(Math.random()*4)];
    addSplash(d.x, d.y + d.size);
  }
});

let tick = 0;
function animate() {
  tick++;
  addSparkle();
  drawBackground(tick, tick);
  for (const d of ducks) d.update(tick);
  for (let i = 0; i < ducks.length; i++) {
    for (let j = i + 1; j < ducks.length; j++) {
      ducks[i].checkCollision(ducks[j]);
    }
  }
  for (const d of ducks) d.draw(tick);
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
