<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quack Attack!</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #87CEEB;
    font-family: Helvetica, Arial, sans-serif;
    overflow: hidden;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  canvas {
    display: block;
    margin: 0 auto;
    max-width: 100%;
    max-height: calc(100% - 44px);
  }
  #controls {
    height: 44px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 12px;
    background: #87CEEB;
    border-top: 2px solid #6bb3e0;
  }
  button {
    font-size: 14px;
    padding: 6px 12px;
    border: 1px solid #2C3E50;
    border-radius: 6px;
    background: #fff;
    cursor: pointer;
  }
  button:hover { background: #eef; }
  label { font-size: 13px; }
  input[type=range] { width: 140px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="800" height="600"></canvas>
  <div id="controls">
    <button id="play">Play music</button>
    <button id="stop">Stop</button>
    <label>Volume <input type="range" id="vol" min="0" max="100" value="70"></label>
    <label id="tap" style="margin-left:auto; font-size:12px; color:#333;">Tap the canvas for a new dance!</label>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

function resize() {
  const availW = window.innerWidth;
  const availH = window.innerHeight - 44;
  const scale = Math.min(availW / W, availH / H, 1);
  canvas.style.width = Math.floor(W * scale) + 'px';
  canvas.style.height = Math.floor(H * scale) + 'px';
}
window.addEventListener('resize', resize);
resize();

// ---------- Ducks ----------
class Duck {
  constructor() {
    this.x = 50 + Math.random() * (W - 100);
    this.y = 250 + Math.random() * (H - 300);
    this.colors = ["#FFD700","#FFA500","#FFB347","#FFCC00","#FFE066"];
    this.color = this.colors[Math.floor(Math.random()*this.colors.length)];
    this.beaks = ["#FF8C00","#FF6600","#FF4500"];
    this.beak = this.beaks[Math.floor(Math.random()*this.beaks.length)];
    this.size = 18 + Math.random() * 10;
    this.phase = Math.random() * Math.PI * 2;
    this.speed = 0.03 + Math.random() * 0.04;
    this.vx = (Math.random() * 0.6) - 0.3;
    this.style = ["bounce","spin","wiggle","wave"][Math.floor(Math.random()*4)];
    this.angle = 0;
    this.foot = Math.random() * Math.PI * 2;
  }

  update(tick) {
    const t = tick * this.speed + this.phase;
    this.foot += 0.15;
    this.x += this.vx;
    if (this.x < 40) { this.vx = Math.abs(this.vx); this.x = 40; }
    if (this.x > W - 40) { this.vx = -Math.abs(this.vx); this.x = W - 40; }
    if (this.style === "bounce") { this.oy = Math.abs(Math.sin(t*2))*25; this.angle = Math.sin(t*3)*15; }
    else if (this.style === "spin") { this.oy = Math.abs(Math.sin(t))*10; this.angle = (tick*2)%360; }
    else if (this.style === "wiggle") { this.oy = Math.sin(t*1.5)*8; this.angle = Math.sin(t*4)*25; }
    else { this.oy = Math.abs(Math.sin(t))*15; this.angle = Math.sin(t*2.5)*20; }
  }

  draw(tick) {
    const s = this.size, dx = this.x, dy = this.y - this.oy;
    // shadow
    ctx.fillStyle = "#555";
    ctx.beginPath();
    ctx.ellipse(dx, this.y + s*0.9, s*0.8, 4, 0, 0, Math.PI*2);
    ctx.fill();

    // feet
    const fo = Math.sin(this.foot)*5;
    ctx.strokeStyle = this.beak;
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    for (const side of [-1,1]) {
      const fx = dx + side*s*0.3, fy = dy + s*0.6;
      ctx.beginPath();
      ctx.moveTo(fx, fy);
      ctx.lineTo(fx + side*3, fy + 8 + fo);
      ctx.lineTo(fx + side*3 - 5, fy + 11 + fo);
      ctx.moveTo(fx + side*3, fy + 8 + fo);
      ctx.lineTo(fx + side*3 + 5, fy + 11 + fo);
      ctx.stroke();
    }

    // body
    ctx.fillStyle = this.color;
    ctx.strokeStyle = "#CC8800";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(dx, dy, s, s*0.6, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();

    // head
    const a = this.angle * Math.PI/180;
    const hx = dx + Math.cos(a)*s*0.7;
    const hy = dy - s*0.7 + Math.sin(a)*3;
    ctx.beginPath();
    ctx.arc(hx, hy, s*0.45, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();

    // eye
    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(hx + s*0.15, hy - s*0.1, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(hx + s*0.15 - 1, hy - s*0.1 - 1, 1, 0, Math.PI*2);
    ctx.fill();

    // beak
    const dir = Math.cos(a);
    const bx = hx + dir*s*0.5, by = hy + s*0.1;
    ctx.fillStyle = this.beak;
    ctx.strokeStyle = "#CC5500";
    ctx.beginPath();
    ctx.moveTo(bx, by-4);
    ctx.lineTo(bx + dir*s*0.4, by);
    ctx.lineTo(bx, by+4);
    ctx.closePath();
    ctx.fill(); ctx.stroke();

    // wing
    const ww = Math.sin(this.foot)*8;
    const wx = dx - s*0.3, wy = dy - s*0.1 + ww;
    ctx.strokeStyle = "#CC8800";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(wx, wy, s*0.5, Math.PI*0.65, Math.PI*0.35, true);
    ctx.stroke();

    // blush
    ctx.fillStyle = "#FF9999";
    ctx.beginPath();
    ctx.ellipse(hx, hy + s*0.12, s*0.15, s*0.08, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

// ---------- Background & scene ----------
function drawBackground(tick, duckTick) {
  const t = duckTick * 0.05;
  ctx.fillStyle = "#87CEEB";
  ctx.fillRect(0, 0, W, 180);

  // sun
  ctx.fillStyle = "#FFE84D";
  ctx.strokeStyle = "#FFD700";
  ctx.lineWidth = 2;
  for (let i=0;i<12;i++) {
    const ang = i*30*Math.PI/180;
    ctx.beginPath();
    ctx.moveTo(85 + Math.cos(ang)*40, 55 + Math.sin(ang)*40);
    ctx.lineTo(85 + Math.cos(ang)*55, 55 + Math.sin(ang)*55);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.arc(85, 55, 35, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  // clouds
  ctx.fillStyle = "white";
  for (const [cx,cy] of [[200,60],[500,40],[680,80]]) {
    for (const [dx,dy] of [[-20,0],[0,-10],[20,0],[-10,5],[10,5]]) {
      ctx.beginPath();
      ctx.arc(cx+dx, cy+dy, 25, 0, Math.PI*2);
      ctx.fill();
    }
  }

  // hills & ground
  ctx.fillStyle = "#4A8F3F";
  ctx.strokeStyle = "#3D7A34";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(-50, 250, 190, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(500, 270, 250, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#5AA84A";
  ctx.fillRect(0, 180, W, H-180);
  ctx.fillStyle = "#3D7A34";
  ctx.fillRect(0, H-40, W, 40);

  // pond
  ctx.fillStyle = "#3498DB";
  ctx.strokeStyle = "#2980B9";
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(400, H, 250, 130, 0, 0, Math.PI); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#5DADE2";
  ctx.beginPath(); ctx.ellipse(400, H, 150, 60, 0, 0, Math.PI); ctx.fill();

  // ripples
  ctx.strokeStyle = "#85C1E9";
  ctx.lineWidth = 1;
  for (let i=0;i<3;i++) {
    const rx = 400 + Math.sin(t+i)*50;
    const ry = 430 + Math.cos(t+i*2)*20;
    ctx.beginPath(); ctx.ellipse(rx, ry, 30+i*10, 8, 0, 0, Math.PI*2); ctx.stroke();
  }

  // sparkles
  for (const s of sparkles) {
    s.life -= 1;
    if (s.life <= 0) { sparkles.splice(sparkles.indexOf(s), 1); continue; }
    ctx.fillStyle = s.color;
    ctx.font = (10 + s.life/2) + "px Helvetica";
    ctx.fillText("*", s.x, s.y);
  }

  // title
  ctx.fillStyle = "#2C3E50";
  ctx.font = "bold 28px Helvetica";
  ctx.textAlign = "center";
  ctx.fillText("Quack Attack!", W/2, 140);
  ctx.font = "10px Helvetica";
  ctx.fillStyle = "#555";
  ctx.fillText("Click anywhere for new dance!", W/2, 170);
}

const sparkles = [];
function addSparkle() {
  if (Math.random() < 0.3) {
    sparkles.push({
      x: 50 + Math.random()*(W-100),
      y: 200 + Math.random()*(H-250),
      life: 20,
      color: ["#FFE84D","#FF69B4","#00FFFF","#FF6347"][Math.floor(Math.random()*4)]
    });
  }
}

// ---------- Audio (Web Audio) ----------
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function makeMelody(volume) {
  ensureAudio();
  const sr = audioCtx.sampleRate;
  // note sequence (freq, beats)
  const seq = [
    [523.25,0.25],[659.25,0.25],[783.99,0.25],[783.99,0.25],
    [880.00,0.25],[783.99,0.25],[659.25,0.25],[587.33,0.25],
    [523.25,0.25],[659.25,0.25],[783.99,0.5],
    [783.99,0.25],[1046.50,0.25],[880.00,0.25],[783.99,0.25],
    [659.25,0.5],[587.33,0.25],[659.25,0.25],[523.25,1.0],
  ];
  const total = seq.reduce((a,[_,d]) => a + d, 0);
  const len = Math.floor(sr * 12);
  const buf = audioCtx.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);
  for (let i=0;i<len;i++) {
    const t = i / sr;
    const seg = t % total;
    let note = 523.25, acc = 0;
    for (const [f,d] of seq) {
      if (seg < acc + d) { note = f; break; }
      acc += d;
    }
    const pIn = seg - (acc >= seg ? 0 : acc);
    const attack = 0.02;
    let env = 1;
    if (pIn < attack) env = pIn/attack;
    else if (seg % (1/note) > (1/note) - attack) env = ((1/note) - (seg%(1/note)))/attack;
    const amp = (volume/100) * 0.4;
    let v = Math.sin(2*Math.PI*note*t) + 0.4*Math.sin(2*Math.PI*note*2*t);
    data[i] = Math.max(-1, Math.min(1, v * env * amp));
  }
  return buf;
}

let source = null;
function playMusic() {
  ensureAudio();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  stopMusic();
  const buf = makeMelody(currentVolume);
  source = audioCtx.createBufferSource();
  source.buffer = buf;
  source.loop = true;
  source.connect(audioCtx.destination);
  source.start();
}
function stopMusic() {
  if (source) { try { source.stop(); } catch(e){} source = null; }
}

let currentVolume = 70;
document.getElementById('play').addEventListener('click', () => { ensureAudio(); playMusic(); });
document.getElementById('stop').addEventListener('click', stopMusic);
document.getElementById('vol').addEventListener('input', (e) => {
  currentVolume = parseInt(e.target.value, 10);
  if (source) playMusic(); // restart to apply new volume
});

// ---------- Interaction & loop ----------
const ducks = [];
for (let i=0;i<6;i++) ducks.push(new Duck());

document.getElementById('vol').addEventListener('input', () => {
  currentVolume = parseInt(document.getElementById('vol').value, 10);
  if (source) playMusic();
});

canvas.addEventListener('click', () => {
  for (const d of ducks) {
    d.phase = Math.random() * Math.PI * 2;
    d.style = ["bounce","spin","wiggle","wave"][Math.floor(Math.random()*4)];
  }
});

let tick = 0;
function animate() {
  tick++;
  addSparkle();
  drawBackground(tick, tick);
  for (const d of ducks) { d.update(tick); d.draw(tick); }
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
